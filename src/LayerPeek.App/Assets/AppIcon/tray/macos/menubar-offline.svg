<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
<title>offline</title>
<!-- LayerPeek macOS menu bar template glyph (T-018): black + alpha only, 18 x 18 pt (@2x = 36 px). Spec: docs/design/macos-tray-icons.md -->
<defs><mask id="clear" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18"><rect x="0" y="0" width="18" height="18" fill="#fff"/>
<polyline points="1.5,1 16.5,17" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</mask></defs>
<g mask="url(#clear)">
<rect x="2" y="1" width="4" height="1" fill="#000" fill-opacity="0.35"/>
<rect x="1" y="3" width="6" height="3" fill="#000" fill-opacity="0.35"/>
<polygon points="3,6 5,6 4.5,7 3.5,7" fill="#000" fill-opacity="0.35"/>
<rect x="1" y="15" width="16" height="2" fill="#000" fill-opacity="0.2"/>
<rect x="1" y="12" width="16" height="2" fill="#000" fill-opacity="0.2"/>
<rect x="1" y="9" width="16" height="2" fill="#000" fill-opacity="0.2"/>
</g>
<polyline points="1.5,1 16.5,17" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
