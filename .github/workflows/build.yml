name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # Native AOT must be compiled on the target OS (no cross-OS AOT).
      - name: Publish (Native AOT)
        run: dotnet publish src/PrusaTrayDiagnostic.App -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaTrayDiagnostic-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 7
