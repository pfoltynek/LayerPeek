name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        Please don't report security issues here, see [SECURITY.md](https://github.com/pfoltynek/LayerPeek/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tray menu
        2. Choose …
        3. …
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the About window.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: printer
    attributes:
      label: Printer model
      multiple: true
      options:
        - CORE One
        - MK4 / MK4S
        - MK3.9 / MK3.9S
        - MK3.5 / MK3.5S
        - XL
        - MINI / MINI+
        - Other
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Printer firmware version
      placeholder: "6.4.0"
  - type: input
    id: camera
    attributes:
      label: Camera (if the problem is camera related)
      placeholder: "Buddy3D, firmware …"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Short report or diagnostic bundle
      description: |
        In the About window, use **Copy info to clipboard** and paste the report here, or save the diagnostic bundle
        (ZIP) and attach it. Passwords are never included, but check the files before uploading them.
      render: text
