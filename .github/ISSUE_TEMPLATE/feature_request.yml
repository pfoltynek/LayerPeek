name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea of the solution. Mockups and screenshots are welcome.
  - type: input
    id: printer
    attributes:
      label: Printer model(s)
      placeholder: "CORE One, MK4S"
