ShortDescription: Watch your Prusa 3D printers from the system tray, with a live camera, print progress and notifications over your local network.
Description: |-
  LayerPeek lives in the Windows notification area (and the macOS menu bar) and shows the state and progress of every
  Prusa printer you add. A click opens a live camera window with the print progress, temperatures and the finish time
  on the picture, and system notifications tell you when a print finishes, the printer needs attention, an error occurs
  or the printer goes offline. It talks to the printers directly over the local network through PrusaLink: no cloud
  service, no account, no telemetry.
  LayerPeek is an independent community project. It is not an official product of Prusa Research and is not affiliated
  with or endorsed by Prusa Research a.s.
